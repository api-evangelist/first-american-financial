onboarding:
  self_service: false
  steps:
    - Sign up at https://developer.firstam.io/signup (two-factor by email).
    - Account reviewed by a Digital Gateway administrator; access granted within 1-2 business days.
    - Create an App, then request access to specific APIs; approval may be automatic or administrator-gated.
    - App ID and App Key appear in the App's Credentials section once approved.
    - Production access additionally requires the First American relationship team and may require a contract and/or SOW.
  contact: DigitalGateway@firstam.io
