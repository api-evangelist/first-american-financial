api: Title & Settlement (Mortgage Services)
transport: https-webhook
delivery:
  direction: provider-to-subscriber
  format: JSON
  envelope: EventNotification
  ack: >-
    "Once the integration partner system responds with a HTTP 200 status code, the EventNotification
    will be considered to have been successfully published."
  retry: >-
    The envelope carries a retryCount field and the Webhook subscription schema exposes a
    Properties.retryCount with an enum of 1-5, so a subscriber chooses the redelivery ceiling.
    No retry schedule or backoff interval is documented.
  security: >-
    Domain whitelisting is required before events will be delivered - contact
    LVIS.support@firstam.com. The Webhook subscription itself carries a `Secret` field described as
    "secret to be used when generating a message hash", so message hashing is supported, but the
    hash algorithm and the header the hash arrives in are NOT documented in the contract. The
    subscription also accepts arbitrary Headers (an x-api-key pair is the documented example) that
    First American will send back to the subscriber endpoint.
  pause: The subscription carries IsPaused, so delivery can be suspended without deleting it.
  filter: The subscription carries a Filter of type EventType, so a subscriber can scope which events it receives.
  correlation: externalTrackingId — the client-supplied id from the originating order
