  - {action: FinalPolicyDelivered, category: document, description: "Delivery of a final title product, such as Owner's Policy or Lender's Policy as a Base64-encoded pdf."}
  - {action: DocumentDelivery, category: document, description: 'Delivery of a document as Base64-encoded pdf.'}
  - {action: CDDraft, category: document, description: 'Delivery of a draft Closing Disclosure as a Base64-encoded pdf.'}
