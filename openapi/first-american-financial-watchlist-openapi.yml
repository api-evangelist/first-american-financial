definitions:
  SearchRequest:
    type: object
    required:
    - EntityType
    - Name
    - RequestorID
    properties:
      Name:
        $ref: '#/definitions/Name'
      ConfidenceScore:
        type: integer
      EntityType:
        type: string
        enum:
        - Company
        - Individual
      State:
        type: string
  ServiceRequestOfac:
    type: object
    required:
    - RequestorID
    - Search
    properties:
      RequestorID:
        type: string
      IncludeAnalytics:
        type: boolean
      Search:
        $ref: '#/definitions/SearchRequest'
    example:
      RequestorID: ID123
      IncludeAnalytics: false
      Search:
        EntityType: Individual
        Name:
          First: Faquir
          Middle: ''
          LastOrCompanyName: Muhammed
        ConfidenceScore: 80
  ServiceRequestFreddieMac:
