          text/json:
            schema:
              type: array
              items:
                type: string
            example:
            - c869db8136f24634bbf3ba6d92c4e8ff
            - 09048da2bb08499b9b5052e16907ba7c
            - da117c76-jhd3-4ee5-a1c1-8fa5ccf1fd51
          application/xml:
            schema:
              type: array
              items:
                type: string
            example:
            - c869db8136f24634bbf3ba6d92c4e8ff
            - 09048da2bb08499b9b5052e16907ba7c
            - da117c76-jhd3-4ee5-a1c1-8fa5ccf1fd51
          text/xml:
            schema:
              type: array
              items:
                type: string
            example:
            - c869db8136f24634bbf3ba6d92c4e8ff
            - 09048da2bb08499b9b5052e16907ba7c
            - da117c76-jhd3-4ee5-a1c1-8fa5ccf1fd51
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                type: string
            example:
            - c869db8136f24634bbf3ba6d92c4e8ff
            - 09048da2bb08499b9b5052e16907ba7c
            - da117c76-jhd3-4ee5-a1c1-8fa5ccf1fd51
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
              example:
              - id: c869db8136f24634bbf3ba6d92c4e8ff
                status: Success
              - id: 09048da2bb08499b9b5052e16907ba7c
                status: Success
              - id: da117c76-jhd3-4ee5-a1c1-8fa5ccf1fd51
                status: Not found
  /webhooks/webhookRequests:
    put:
      security:
      - bearerAuth: []
      tags:
      - Webhooks
      summary: Update mutiple Webhooks
      description: Update mutiple Webhooks with First American
      operationId: Webhooks_MultipulePUT
      requestBody:
        description: Webhook Request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks'
            example:
            - AppSource: OpenAPI
              Uri: notification endpoint URL
              Id: c869db8136f24634bbf3ba6d92c4e8ff
              Secret: integrator's secret
              Description: Subscription to OrderCreated event
              IsPaused: false
              Filter: OrderCreated
              Headers:
                x-api-key: integrator's key
              Properties:
                retryCount: 5
            - AppSource: OpenAPI
              Uri: notification endpoint URL
              Id: 09048da2bb08499b9b5052e16907ba7c
              Secret: integrator's secret
              Description: Subscription to CurativeCleared event
              IsPaused: false
              Filter: CurativeCleared
              Headers:
                x-api-key: integrator's key
              Properties:
                retryCount: 2
            - AppSource: OpenAPI
              Uri: notification endpoint URL
              Id: da117c76-jhd3-4ee5-a1c1-8fa5ccf1fd51
              Secret: integrator's secret
              Description: Subscription to DocumentDelivery event
              IsPaused: false
              Filter: DocumentDelivery
              Headers:
                x-api-key: integrator's key
              Properties:
                retryCount: 3
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhooks'
              example:
              - Id: c869db8136f24634bbf3ba6d92c4e8ff
                Status: Success
              - Id: 09048da2bb08499b9b5052e16907ba7c
                Status: Uri/Domain Unauthorized
              - Id: da117c76-jhd3-4ee5-a1c1-8fa5ccf1fd51
                Status: integrator's secret
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth (a.k.a JWT) Authentication is **mandatory**. Please enter a valid access token
  schemas:
    TokenResult:
      type: object
      properties:
        token_type:
          type: string
        expires_in:
          type: integer
        ext_expires_in:
          type: integer
        access_token:
          type: string
    OrderRequest:
      type: object
      properties:
        appSource:
          type: string
          description: A required unique application ID provided by First American Title to identify clients.
        service:
          enum:
          - Escrow
          - Title
          - EscrowTitle
          type: string
          description: A required value of available service options provided by First American Title.
          example: TitleEscrow
        parties:
          uniqueItems: false
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/IndividualParty'
            - $ref: '#/components/schemas/LegalEntityParty'
          description: List of parties involved in the transaction. Party type can be either LegalEntityParty
            or IndividualParty
        propertyAddress:
          $ref: '#/components/schemas/PropertyAddress'
        officeId:
          type: string
          description: An optional field that can be provided if a preference of service location exists.
            An officeId can be obtained via the Offices resource.
          example: 4356
        escrowOfficerCode:
          type: string
          description: An optional field that can be provided for escrow officer.  An escrowOfficerCode
            can be obtained via the employees/escrowOfficers resource.
          example: CJCLEMENS
        titleOfficerCode:
          type: string
          description: An optional field that can be provided for title officer.  A titleOfficerCode can
            be obtained via the employees/titleOfficers resource.
          example: CJCLEMENS
        transactionType:
          enum:
          - SaleWithMortgage
          - SaleCash
          - Refinance
          - EquityLoan
          - SaleWithConstructionLoan
          - ConstructionFinance
          - SearchPackage
          - Other
          type: string
          description: A required value that specifies the purpose for the transaction service request.
          example: SaleWithMortgage
        notes:
          type: string
          description: An optional free text field for additional service request information.
        externalTrackingId:
          type: string
          description: Client provided transaction ID used to communicate inbound and outbound.
        loan:
          $ref: '#/components/schemas/Loan'
        Documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
          description: List of documents involved in the transaction.
        transactionDetails:
          $ref: '#/components/schemas/TransactionDetails'
      required:
      - appSource
      - service
      - parties
      - propertyAddress
      - transactionType
      - externalTrackingId
    Party:
      type: object
      properties:
        PrimaryName:
          type: string
        TaxId:
          type: string
        OtherRole:
          enum:
          - NotApplicable
          - BuyerBorrower
          - Seller
          - BuyerRealEstateAgent
          - SellerRealEstateAgent
          - Lender
          - PayoffLender
          - MortgageBroker
          type: string
        Addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
      required:
      - Role
      - stateCode
    IndividualParty:
      type: object
      properties:
        firstName:
          type: string
          description: 'The first name of the party in the transaction. '
        lastName:
          type: string
          description: 'The last name of the party in the transaction. '
        maritalStatus:
          enum:
          - aSingleMan
          - aSingleWoman
          - aSinglePerson
          - HusbandAndWife
          - aMarriedMan
          - aMarriedWoman
          - anUnmarriedPerson
          - aRegisteredDomesticPartner
          - NotApplicable
          - Other
          type: string
          description: The marital status of the party in the transaction.
          example: HusbandAndWife
        middleName:
          type: string
          description: The middle name of the party in the transaction.
        salutation:
          type: string
          description: The salutation of the party in the transaction.
        suffix:
          type: string
          description: The suffix of the party in the transaction.
        spouseName:
          type: string
          description: The spouse name of the party in the transaction.
        contactPoints:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/ContactPoint'
          description: A list of contact points.
        primaryName:
          type: string
          description: The primary name of the party in the transaction.
        taxId:
          type: string
          description: The tax ID of the party in the transaction.
        role:
          $ref: '#/components/schemas/IndividualPartyRole'
        otherrole:
          enum:
          - NotApplicable
          - BuyerBorrower
          - Seller
          - BuyerRealEstateAgent
          - SellerRealEstateAgent
          - CoBuyerBorrower
          - Other
          - MortgageBroker
          - BuyerRealEstateBroker
          - BuyerAttorney
          - BuyerTransactionCoordinator
          - NewLender
          - SellerAttorney
          - SellerRealEstateBroker
          - SellerTransactionCoordinator
          - OutsideTitle
          - OutsideEscrow
          - Builder
          - Investor
          type: string
          description: Only use this when RequestingSource is provided as the role. Consult with First
            American before using.
        addresses:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/Address'
      required:
      - role
      - firstName
      - lastName
    LegalEntityParty:
      type: object
      properties:
        legalEntity:
          enum:
          - Trust
          - BusinessEntity
