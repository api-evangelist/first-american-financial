      properties:
        appSource:
          type: string
          example: Replace with FA Provided ID
        ServiceType:
          $ref: '#/components/schemas/ServiceType'
        Message:
          type: string
          description: The required message content.
        MessageType:
          type: string
          description: The required message type.
      required:
      - AppSource
      - ServiceType
      - Message
    ClientContactUpdate:
      title: ClientContactUpdate
      type: object
      properties:
        AppSource:
          type: string
