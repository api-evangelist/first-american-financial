          type: integer
          format: int32
          description: The number of times we have attempted to deliver this message.
        Notifications:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          description: A collection of events. Currently only one event is provided per notification.
    Event:
      title: Event
      type: object
