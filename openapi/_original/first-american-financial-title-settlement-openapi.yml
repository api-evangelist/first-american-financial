        \ | ServiceResponse\n DocumentDelivery | DocumentPayload\n CurativeCleared | CurativeClearedMessagePayload\n\
        \ FundsDisbursed | FundsDisbursedMessagePayload\n MessageAdded | MessagePayload\n FundingApproved\
        \ | MessagePayload\n CurativePending | MessagePayload\n DisburseHold | MessagePayload\n OrderRejected\
        \ | MessagePayload\n OrderCancelled | MessagePayload\n OrderClosed | MessagePayload\n AppointmentScheduled\
        \ | MessagePayload\n TitleProductDelivered | DocumentPayload\n FinalPolicyDelivered | DocumentPayload\n\
        \ CDDraft | DocumentPayload\n CDBalanced | MessagePayload\n RecordingCompleted | MessagePayload\n\
        \ SigningOrdered | MessagePayload\n SigningBorrowerNotified | MessagePayload\n SigningCompleted\
        \ | MessagePayload\n . | .\n"
    MessagePayload:
      title: MessagePayload
