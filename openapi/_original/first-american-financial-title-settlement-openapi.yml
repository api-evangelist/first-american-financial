      - MortgageBroker
      - HomeOwnerAssociation
      - HomeOwnerInsurance
      - Other
      - BuyerRealEstateBroker
      - BuyerAttorney
      - BuyerTransactionCoordinator
      - NewLender
      - SellerAttorney
      - SellerRealEstateBroker
      - SellerTransactionCoordinator
      type: string
      description: "The role of the party in the transaction.  BuyerBorrower required. \n\nRequestingSource\
