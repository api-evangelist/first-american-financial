  /webhooks/registerWebhooks:
    post:
      security:
      - bearerAuth: []
      tags:
      - Webhooks
      summary: Register mutiple Webhooks
      description: Register mutiple Webhooks with First American
      operationId: Webhooks_Post_Multiple
      requestBody:
        description: Webhook Request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks'
            example:
            - AppSource: Offerpad
              Uri: https://pdl.com/v1/FirstAmerican/order_different
              Secret: integrator's secret
              Description: Register multiple webhook 1
              IsPaused: true
              Filter: OrderClosed
              Headers:
                x-api-key: integrator's key
              Properties:
                retryCount: 2
            - AppSource: Offerpad
              Uri: https://pdl.com/v1/FirstAmerican/order_different
              Secret: integrator's secret
              Description: Register multiple webhook 1
              IsPaused: false
              Filter: FundingApproved
              Headers:
                x-api-key: integrator's key
              Properties:
                retryCount: 2
            - AppSource: Offerpad
              Uri: https://pdl.com/v1/FirstAmerican/order_different
              Secret: integrator's secret
              Description: Register multiple webhook 1
              IsPaused: true
              Filter: OrderClosed
              Headers:
                x-api-key: integrator's key
              Properties:
                retryCount: 2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhooks'
              example:
              - AppSource: Offerpad
                Uri: https://pdl.com/v1/FirstAmerican/order_different
                Id: 9aaead9f0e2c4ca8af6d67be87a10272
                Secret: integrator's secret
                Description: Register multiple webhook 1
                IsPaused: true
                Filter: OrderClosed
                Headers:
                  x-api-key: integrator's key
                Properties:
                  retryCount: 2
              - Status: Failed
                Message: Filter:(FundingApproved) already exist.
              - Status: Failed
                Message: Invalid AppSource
