    ResourceResponse:
      type: object
      properties:
        ID:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
          description: A unique message ID used for troubleshooting.
        externalReferenceId:
          type: string
          description: An echo of the externalReferenceId provided in the request.
        DateTime:
          $ref: '#/components/schemas/UtcDateTime'
        Status:
          format: int32
          type: integer
          description: 1 indicates success. 0 indicates failure. Review Message field for details.
        Message:
          type: string
          description: Provides a detailed desciption of the Status field.
