        PropertySubType:
          example: PropertySubType
          type: string
        Beds:
          example: Beds
          type: string
        Baths:
          example: Baths
          type: string
        ResidenceSqFt:
          example: ResidenceSqFt
          type: string
        LotSqFt:
          example: LotSqFt
          type: string
        LotFeatures:
          example: LotFeatures
          type: string
        YearBuilt:
          example: YearBuilt
          type: string
        DaysOnMarket:
          example: DaysOnMarket
          type: string
        Address:
          $ref: '#/components/schemas/Address'
        Latitude:
          example: Latitude
          type: string
        Longitude:
          example: Longitude
          type: string
        APN:
