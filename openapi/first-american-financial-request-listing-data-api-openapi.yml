openapi: 3.2.0
info:
  description: ''
  version: 1.0.0
  title: Property Service Request Listing Data API
servers:
- url: https://api.firstam.io/v1
tags:
- name: Request Listing Data
paths:
  /property/order/listinghistory:
    post:
      tags:
      - Request Listing Data
      summary: Request for Listing History
      description: 'Listing History: Current status of listing, on/off market and as past sales history. Required fields: StreetAddress1, City, State, ZipCode.'
      operationId: reqListingHistory
      parameters:
      - in: header
        name: x-app-id
        description: Application ID
        required: true
        schema:
          type: string
      - in: header
        name: x-app-key
        description: Application Key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDataResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ListingDataResponse'
        '400':
          description: Invalid Input, Object Invalid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyServiceRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/PropertyServiceRequest'
        description: Request for Property
        required: true
  /property/order/localmarkettrends:
    post:
      tags:
      - Request Listing Data
      summary: Request for Local Market Trends
      description: 'Market Trends: Returns data related to local price related averages and trends. Required fields: StreetAddress1, City, State, ZipCode.'
      operationId: reqLocalMarketTrend
      parameters:
      - in: header
        name: x-app-id
        description: Application ID
        required: true
        schema:
          type: string
      - in: header
        name: x-app-key
        description: Application Key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDataResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ListingDataResponse'
        '400':
          description: Invalid Input, Object Invalid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyServiceRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/PropertyServiceRequest'
        description: Request for Property
        required: true
  /property/order/nearbyactivelistings:
    post:
      tags:
      - Request Listing Data
      summary: Request for Nearby Active Listings
      description: 'Nearby Listings: Returns listing results related to nearby properties for sale. Required fields: StreetAddress1, City, State, ZipCode.'
      operationId: reqNearbyActiveListings
      parameters:
      - in: header
        name: x-app-id
        description: Application ID
        required: true
        schema:
          type: string
      - in: header
        name: x-app-key
        description: Application Key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDataResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ListingDataResponse'
        '400':
          description: Invalid Input, Object Invalid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyServiceRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/PropertyServiceRequest'
        description: Request for Property
        required: true
