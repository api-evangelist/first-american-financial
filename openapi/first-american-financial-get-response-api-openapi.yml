- url: https://api.firstam.io/v1
- url: https://api.dgw.firstam.io/v2
tags:
- name: Get Response
paths:
  /bankruptcy/report:
    get:
      tags:
      - Get Response
      summary: Retrieve existing bankruptcy report by transactionID
      description: Add a transactionID to the query string to retrieve an existing report
      operationId: get
      parameters:
      - in: header
        name: x-app-id
        description: Application ID
        required: true
        schema:
          type: string
      - in: header
        name: x-app-key
        description: Application Key
        required: true
        schema:
          type: string
      - name: transactionID
        in: query
        description: Unique identifier tied to a report
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankruptcyServiceResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/BankruptcyServiceResponse'
        '400':
          description: Bad Request (missing/invalid transactionID)
        '401':
          description: Invalid App ID or Key
        '404':
          description: Not Found (no report found by transactionID)
        '500':
          description: Internal Server Error
        '503':
          description: Usage Limit Exceeded
    servers:
    - url: https://api-w2.firstam.io/v1
