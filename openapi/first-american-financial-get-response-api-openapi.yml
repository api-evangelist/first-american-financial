info:
  title: First American Financial Get Response API
  version: '1.0'
  description: 'Operations tagged Get Response across 8 of this provider''s published API definitions: first-american-financial-bankruptcy-openapi.json, first-american-financial-income-estimate-openapi.json, first-american-financial-liens-judgments-fcra-openapi.json, first-american-financial-liens-judgments-non-fcra-openapi.json, first-american-financial-property-openapi.json, first-american-financial-reverse-address-openapi.json, first-american-financial-scra-openapi.json…'
