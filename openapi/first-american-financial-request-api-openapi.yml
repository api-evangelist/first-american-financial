        '500':
          description: Internal Server Error
        '503':
          description: Usage Limit Exceeded
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/consentform'
        description: Upload consent form
        required: true
    servers:
    - url: https://api.firstam.io/v1
  /4506t/transcript:
    get:
      tags:
      - Request
      summary: Retrieve transcript
      description: Retrieve transcript.
      operationId: getTranscript
      parameters:
      - in: header
        name: x-app-id
        description: Application ID
        required: true
        schema:
          type: string
      - in: header
        name: x-app-key
        description: Application Key
        required: true
        schema:
          type: string
      - name: transactionID
        in: query
        description: Unique Identifier Tied to Order
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transcript'
        '400':
          description: Bad Request (Missing/Invalid TransactionID)
        '401':
          description: Invalid App ID or Key
        '404':
          description: Not Found (No Report Found by TransactionID)
        '500':
          description: Internal Server Error
        '503':
          description: Usage Limit Exceeded
    servers:
    - url: https://api.firstam.io/v1
  /4506t/transcriptpdf:
    get:
      tags:
      - Request
      summary: Retrieve transcript pdf
      operationId: getTranscriptPDF
      parameters:
      - in: header
        name: x-app-id
        description: Application ID
        required: true
        schema:
          type: string
      - in: header
        name: x-app-key
        description: Application Key
        required: true
        schema:
          type: string
      - name: transactionID
        in: query
        description: Unique Identifier Tied to Order
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  TransactionID:
                    type: string
                  RequestorID:
                    type: string
                  OrderStatus:
                    $ref: '#/components/schemas/orderstatus'
                  TranscriptPDF:
                    type: string
                    description: Base64 encoded PDF file
        '400':
          description: Bad Request (Missing TransactionID)
        '401':
          description: Invalid App ID or Key
        '404':
          description: Not Found (No Report Found by TransactionID)
        '500':
          description: Internal Server Error
        '503':
          description: Usage Limit Exceeded
    servers:
    - url: https://api.firstam.io/v1
