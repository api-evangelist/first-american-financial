openapi: 3.2.0
info:
  description: ''
  version: v1
  title: Get NMLS data by NMLS ID API
servers:
- url: https://api-w2.firstam.io/v1
tags:
- name: Get NMLS data by NMLS ID
paths:
  /nmls/lookup:
    get:
      tags:
      - Get NMLS data by NMLS ID
      summary: Retrieve NMLS data by NMLS ID
      description: Add a NMLS ID to the query string to retrieve NMLS data. Optional alert analytics can be performed by appending '&includeanalytics=true' to the query string.
      operationId: get
      parameters:
      - in: header
        name: x-app-id
        description: Application ID
        required: true
        schema:
          type: string
      - in: header
        name: x-app-key
        description: Application Key
        required: true
        schema:
          type: string
      - name: nmlsid
        in: query
        description: NMLS ID
        required: true
        schema:
          type: string
          default: 857740
      - in: query
        name: includeanalytics
        description: Analytics Flag
        required: false
        schema:
          type: string
          default: 'false'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '400':
          description: Bad Request (Missing/Invalid NMLS ID)
        '401':
          description: Invalid App ID or Key
        '404':
          description: Not Found (No NMLS Data Found by NMLS ID)
        '500':
          description: Internal Server Error
        '503':
          description: Usage Limit Exceeded
    post:
      tags:
      - Get NMLS data by NMLS ID
      summary: Retrieve NMLS data by NMLS ID with added parameters for alert analytics
      description: Add a NMLS ID to the query string and add additional parameters in the request body for alert analytics. Must set "IncludeAnalytics" flag to true in the request body.
      operationId: post
      parameters:
      - in: header
        name: x-app-id
        description: Application ID
        required: true
        schema:
          type: string
      - in: header
        name: x-app-key
        description: Application Key
        required: true
        schema:
          type: string
      - name: nmlsid
        in: query
        description: NMLS ID
        required: true
        schema:
          type: string
          default: 857740
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '400':
          description: Bad Request (Missing/Invalid NMLS ID)
        '401':
          description: Invalid App ID or Key
        '404':
          description: Not Found (No NMLS Data Found by NMLS ID)
        '500':
          description: Internal Server Error
        '503':
          description: Usage Limit Exceeded
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
        description: Request for NMLS
        required: true
