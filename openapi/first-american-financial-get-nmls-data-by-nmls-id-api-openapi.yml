          type: string
        RegulatorStateCode:
          type: string
        LicenseNumber:
          type: string
        LicenseType:
          type: string
        IssueDate:
          type: string
        Status:
          type: string
        StatusDate:
          type: string
        IsAuthorizedToConductBusiness:
          type: boolean
        RenewedThrough:
          type: string
        IsLatest:
          type: boolean
        LicenseHistory:
          type: array
          items:
            $ref: '#/components/schemas/LicenseHistory'
    Name:
      type: object
      properties:
        Full:
          type: string
        First:
          type: string
        Middle:
          type: string
        Last:
          type: string
        Suffix:
          type: string
        Prefix:
          type: string
        LastOrCompanyName:
          type: string
        FirstAndMiddleName:
          type: string
    IndividualDisciplinaryActions:
      type: object
      properties:
        AuthorityType:
          type: string
        ActionType:
          type: string
        DateOfAction:
          type: string
        NameOfAuthority:
          type: string
        DisciplinaryActionDetail:
          type: string
        AssociatedDocumentURL:
          type: string
    RegulatoryAction:
      type: object
      properties:
        EntityType:
          type: string
        Regulator:
          type: string
        ActionType:
          type: string
        DateOfAction:
          type: string
        MultiStateActionID:
          type: string
        DocketNumber:
          type: string
        AssociatedDocumentURL:
          type: string
    ServiceRequest:
      type: object
      properties:
        Name:
          $ref: '#/components/schemas/Name'
        Address:
          $ref: '#/components/schemas/Address'
        NMLSID:
          type: integer
        ConfidenceScore:
          type: integer
        IncludeAnalytics:
          type: boolean
      example:
        RequestorID: ID123
        IncludeAnalytics: false
        NMLSID: 349974
        Name:
          First: John
          Middle: Travis
          LastOrCompanyName: Harrison
        Address:
          State: CO
        ConfidenceScore: 90
    IndividualAgencyRegistrationHistory:
      type: object
      properties:
        PrimaryFederalRegulator:
          type: string
        StartDate:
          type: string
        EndDate:
          type: string
        IsAuthorized:
          type: boolean
    CompanyResponse:
      type: object
      properties:
        Name:
          type: string
        Address:
          $ref: '#/components/schemas/Address'
        DBAs:
          type: array
          items:
            type: string
        ParentCompanyNMLSID:
          type: integer
        IsAuthorizedToConductBusiness:
          type: boolean
        BranchManager:
          type: array
          items:
            $ref: '#/components/schemas/BranchManager'
        NMLSID:
          type: integer
        EntityType:
          type: string
        IsFederallyRegulated:
          type: boolean
        PrimaryFederalRegulator:
          type: string
        RegistrationStatus:
          type: string
        BusinessStructure:
          type: string
        FiscalYearEnd:
          type: string
        FormedIn:
          type: string
        DateFormed:
          type: string
        StockSymbol:
          type: string
        SponsoredMLOCount:
          type: integer
        RegisteredMLOCount:
          type: string
        Licenses:
          type: array
          items:
            $ref: '#/components/schemas/License'
        OtherNames:
          type: array
          items:
            $ref: '#/components/schemas/OtherTradeName'
        CompanyWebsites:
          type: array
          items:
            type: string
        RegulatoryActions:
          type: array
          items:
            $ref: '#/components/schemas/RegulatoryAction'
    IndividualRegistration:
      type: object
      properties:
        RegistrationName:
          type: string
        RegistrationStatus:
          type: string
        IsAuthorizedToConductBusiness:
          type: boolean
    ServiceResponse:
      type: object
      properties:
        Company:
          $ref: '#/components/schemas/CompanyResponse'
        Individual:
          $ref: '#/components/schemas/IndividualResponse'
