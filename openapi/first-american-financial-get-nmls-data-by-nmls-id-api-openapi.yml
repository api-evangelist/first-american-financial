        StateCityZip:
          type: string
        PostalCode:
          type: string
        Country:
          type: string
        County:
          type: string
        ZipFour:
          type: string
        ZipCode:
          type: string
        Hash:
          type: string
        State:
          type: string
        StreetAddress2:
          type: string
        StreetAddress1:
          type: string
        UnitNumber:
          type: string
        UnitDesignation:
          type: string
        StreetPostDirection:
          type: string
        StreetSuffix:
          type: string
        StreetName:
          type: string
        StreetPreDirection:
          type: string
        StreetNumber:
          type: string
        City:
          type: string
        FullAddress:
          type: string
    BranchManager:
      type: object
      properties:
        NMLSID:
          type: integer
        Name:
          type: string
        Industry:
          type: string
        States:
          type: array
          items:
            type: string
    Sponsor:
      type: object
      properties:
        NMLSID:
          type: string
        Name:
          type: string
        Regulator:
          type: string
        RegulatorStateCode:
          type: string
        LicenseType:
          type: string
        StartDate:
          type: string
        EndDate:
          type: string
    IndividualResponse:
      type: object
      properties:
        Name:
          $ref: '#/components/schemas/Name'
        IndividualAgencyRegistrations:
          type: array
          items:
            $ref: '#/components/schemas/IndividualAgencyRegistration'
        DisciplinaryActions:
          type: array
          items:
            $ref: '#/components/schemas/IndividualDisciplinaryActions'
        Licenses:
          type: array
          items:
            $ref: '#/components/schemas/NMLSIndividualLicense'
        Locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        OtherNames:
          type: array
          items:
            $ref: '#/components/schemas/NMLSName'
        IndividualRegistration:
          $ref: '#/components/schemas/IndividualRegistration'
        IndividualRegistrationDetails:
          type: array
          items:
            $ref: '#/components/schemas/IndividualRegistrationDetail'
        RegulatoryActions:
          type: array
          items:
            $ref: '#/components/schemas/RegulatoryAction'
    IndividualRegistrationDetail:
      type: object
      properties:
