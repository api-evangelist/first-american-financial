          type: string
        InstitutionName:
          type: string
        InstitutionNMLSID:
          type: integer
        PrimaryFederalRegulator:
          type: string
        StartDate:
          type: string
        EndDate:
          type: string
    NMLSIndividualLicense:
      type: object
      properties:
        License:
          $ref: '#/components/schemas/License'
        Sponsorships:
          type: array
          items:
            $ref: '#/components/schemas/Sponsor'
    NMLSName:
      type: object
      properties:
        NameType:
          type: string
        Name:
          $ref: '#/components/schemas/Name'
    LicenseHistory:
      type: object
      properties:
        StartDate:
          type: string
        EndDate:
          type: string
        IsAuthorized:
          type: boolean
    IndividualAgencyRegistration:
      type: object
      properties:
        PrimaryFederalRegulator:
          type: string
        Status:
          type: string
        StatusDate:
          type: string
        RegistrationHistory:
          type: array
          items:
            $ref: '#/components/schemas/IndividualAgencyRegistrationHistory'
    Location:
      type: object
      properties:
        CompanyName:
          type: string
        LocationNMLSID:
          type: string
        LocationType:
          type: string
        Street:
          type: string
        StartDate:
          type: string
        Address:
          $ref: '#/components/schemas/Address'
    OtherTradeName:
      type: object
      properties:
        Regulator:
          type: string
        Name:
          type: string
        NameType:
          type: string
    License:
