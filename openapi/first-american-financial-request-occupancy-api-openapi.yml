openapi: 3.2.0
info:
  version: v1
  title: Occupancy Service Request Occupancy API
servers:
- url: https://solutions.dgw.firstam.io/v1
tags:
- name: Request Occupancy
paths:
  /occupancy/report:
    get:
      tags:
      - Request Occupancy
      operationId: Report
      parameters:
      - in: header
        name: X-App-Id
        description: Application ID
        required: true
        schema:
          type: string
      - in: header
        name: X-App-Key
        description: Application Key
        required: true
        schema:
          type: string
      - name: transactionID
        in: query
        required: false
        schema:
          type: string
          default: 4514c308-468f-438a-bd8f-253c6c3cbd65
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancyServiceResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OccupancyServiceResponse'
      summary: Report
      x-summary-source: derived
  /occupancy/report/pdf:
    get:
      tags:
      - Request Occupancy
      summary: Get PDF report
      operationId: ReportPDF
      parameters:
      - in: header
        name: X-App-Id
        description: Application ID
        required: true
        schema:
          type: string
      - in: header
        name: X-App-Key
        description: Application Key
        required: true
        schema:
          type: string
      - name: transactionID
        in: query
        required: false
        schema:
          type: string
          default: 4514c308-468f-438a-bd8f-253c6c3cbd65
      responses:
        '200':
          description: Success
  /occupancy/order:
    post:
      tags:
      - Request Occupancy
      summary: Make a new Occupancy service call to get a Occupancy check on the property
      description: 'Required fields: First Name, Last Name, SSN, Subject Address, Loan Purpose, Occupancy'
      operationId: Order
      parameters:
      - in: header
        name: X-App-Id
        description: Application ID
        required: true
        schema:
          type: string
      - in: header
        name: X-App-Key
        description: Application Key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancyServiceResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OccupancyServiceResponse'
        '400':
          description: Invalid Input, Object Invalid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccupancyServiceRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/OccupancyServiceRequest'
components:
  schemas:
    Address:
      type: object
      properties:
        streetNumber:
