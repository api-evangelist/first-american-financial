        streetPreDirection:
          type: string
        streetName:
          type: string
        streetSuffix:
          type: string
        streetPostDirection:
          type: string
        unitDesignation:
          type: string
        unitNumber:
          type: string
        streetAddress1:
          type: string
        streetAddress2:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        zipFour:
          type: string
        county:
          type: string
        country:
          type: string
        postalCode:
          type: string
        stateCityZip:
          type: string
        latitude:
          type: string
        longitude:
          type: string
        apn:
          type: string
        hash:
          type: string
        fullAddress:
          type: string
        countyFIPSCode:
