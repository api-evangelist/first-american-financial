          - 'null'
        OwnerName4:
          type:
          - string
          - 'null'
        Buyer1IDCodeDesc:
          type:
          - string
          - 'null'
        Buyer2IDCodeDesc:
          type:
          - string
          - 'null'
        Vesting:
          type:
          - string
          - 'null'
        VestingCodeDesc:
          type:
          - string
          - 'null'
        CurrentOwnerAsOf:
