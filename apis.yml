aid: first-american-financial
name: First American Financial
description: 'First American Financial Corporation (NYSE: FAF) is a leading provider of title insurance,
  settlement services, property data and risk solutions for real estate and mortgage transactions, and
  one of the largest title insurance underwriters in the United States. Its public API surface is the
  Digital Gateway (developer.firstam.io), a 3scale-managed developer portal operated by First American
  Mortgage Solutions and First American Data & Analytics, which publishes 16 machine-readable specifications
  covering 93 operations: title and escrow order management with a 21-event webhook catalogue, nationwide
  property and ownership data, occupancy, identity and SSN verification, bankruptcy, IRS 4506-C tax transcripts,
  reverse phone and address search, SCRA military-service checks, liens and judgments in separate FCRA
  and non-FCRA contracts, OFAC and agency watchlist screening, and NMLS license verification. A second,
  separate request-access portal at developer.firstam.com fronts the same title and settlement integration.
  Access to every API is approval-gated: an administrator reviews each account, credentials are issued
  per App as an App ID and App Key pair, and production access additionally requires the First American
  relationship team and may require a contract or SOW.'
type: Index
