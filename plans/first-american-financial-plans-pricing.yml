note: >-
  FIRST AMERICAN PUBLISHES NO PLANS AND NO PRICES. This file previously carried a three-tier
  Free / Professional / Enterprise scaffold written by the 2026-05-04 bulk sweep with invented
  quotas and prices; none of it came from First American and it has been removed. What the provider
  actually publishes is a negotiated-access model with no numbers anywhere - access to every API is
  granted per App by an administrator, and the documentation states that going live "may include
  formal Contract and/or SOW" arranged through the First American relationship team. Quotas exist
  but are contractual: the glossary defines a License as "a tailored API access package designed by
  the API Admin and offered to the App developer" whose License Terms carry "quality of service
  (QoS) policies", and a QoS policy as defining "for example, the number of transactions per minute
  that are allowed for the app". Those numbers are set per contract and are not published.
pricing_model: negotiated
public_pricing_page: false
self_service_signup: false
self_service_note: >-
  Sign-up at https://developer.firstam.io/signup is open, but it only creates a portal account,
  which an administrator then reviews (1-2 business days). Neither sandbox nor production API access
  is self-service, and no plan can be purchased online.
